services:
  worker:
    image: texnikach-transcription-worker:20260919-uzbek-callcenter
    container_name: texnikach-transcription-worker
    restart: unless-stopped
    init: true
    cpus: 1.5
    mem_limit: 4608m
    memswap_limit: 5120m
    oom_score_adj: 500
    pids_limit: 128
    stop_grace_period: 5m
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    env_file: ./worker.env
    environment:
      TRANSCRIPTION_ENABLED: "true"
      TRANSCRIPTION_WORKER_MODE: external
      LOCAL_TRANSCRIPTION_BACKEND: hybrid
      LOCAL_TRANSCRIPTION_DEVICE: cpu
      LOCAL_TRANSCRIPTION_COMPUTE_TYPE: int8
      LOCAL_WHISPER_MODEL: small
      LOCAL_TRANSCRIPTION_CPU_THREADS: "2"
      LOCAL_DIARIZATION_BATCH_SIZE: "1"
      LOCAL_DIARIZATION_MAX_DURATION_SECONDS: "180"
      LOCAL_TRANSCRIPTION_SPEECH_GAP: "1.5"
      LOCAL_WHISPER_MODEL_PATH: /models/whisper-small
      LOCAL_UZBEK_WHISPER_MODEL: Abduqayum/whisper-uzbek-medium-callcenter
      LOCAL_UZBEK_WHISPER_MODEL_PATH: /models/whisper-uzbek-callcenter-medium
      LOCAL_DIARIZATION_MODEL_PATH: /models/diarization
      DB_PATH: /app/data/calls.db
      HF_HUB_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      PYANNOTE_METRICS_ENABLED: "0"
      OTEL_SDK_DISABLED: "true"
      DO_NOT_TRACK: "1"
      HF_HOME: /tmp/hf
      XDG_CACHE_HOME: /tmp/cache
      MPLCONFIGDIR: /tmp/mpl
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "1"
      MONITORING_ENABLED: "false"
      TELEGRAM_BUSINESS_ENABLED: "false"
      FORWARDING_ENABLED: "false"
      PRICE_SERVER_ENABLED: "false"
    volumes:
      - calls-data:/app/data
      - /opt/texnikach-transcription-20260918/venv:/stage/venv:ro
      - /opt/texnikach-transcription-20260918/models/diarization:/models/diarization:ro
      - /opt/texnikach-transcription-models/whisper-small:/models/whisper-small:ro
      - /opt/texnikach-transcription-models/whisper-uzbek-callcenter-medium:/models/whisper-uzbek-callcenter-medium:ro
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  calls-data:
    external: true
    name: nylgfmvjodgie9dga7ngprgl-botmoizvonki-data
