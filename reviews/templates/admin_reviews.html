<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0a0a0a">
  <title>Texnikach — отзывы клиентов</title>
  <style>
    :root{--bg:#090909;--panel:#141414;--panel2:#1a1a1a;--line:#2b2b2b;--text:#f5f3ed;--muted:#9c9991;--gold:#e3b95f;--green:#58c78b;--red:#ed786e;--orange:#e6a44e;--radius:18px}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.layout{width:min(1500px,100%);margin:auto;padding:24px}.header{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:24px}.brand{font-size:13px;letter-spacing:.17em;color:var(--gold);font-weight:900}.header h1{font-size:32px;margin:5px 0 0;letter-spacing:-.035em}.header p{margin:0;color:var(--muted)}
    .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px}.periods,.checks{display:flex;gap:8px;flex-wrap:wrap}.period{border:1px solid var(--line);background:#1b1b1b;color:#bbb;border-radius:10px;padding:9px 13px;cursor:pointer}.period.active{background:#3a2f19;color:var(--gold);border-color:#725b2d}.filters{display:grid;grid-template-columns:repeat(6,minmax(130px,1fr));gap:10px;margin-top:13px}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}.field select,.field input{width:100%;height:40px;border:1px solid var(--line);background:#0d0d0d;color:var(--text);border-radius:10px;padding:0 10px}.checks{margin-top:13px}.check{display:flex;gap:7px;align-items:center;color:#cbc8c0}.apply{height:40px;align-self:end;border:0;border-radius:10px;background:var(--gold);color:#1e1608;font-weight:850;cursor:pointer}
    .summary{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}.metric{background:linear-gradient(145deg,#181818,#111);border:1px solid var(--line);border-radius:var(--radius);padding:17px}.metric .value{font-size:28px;font-weight:850;letter-spacing:-.03em}.metric .label{color:var(--muted);margin-top:3px}.metric.alert .value{color:var(--red)}
    .grid{display:grid;grid-template-columns:1.3fr .7fr;gap:16px}.section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.section-title h2{font-size:18px;margin:0}.section-title span{color:var(--muted);font-size:12px}.category-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.category{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:13px}.cat-head{display:flex;justify-content:space-between;gap:10px}.cat-name{color:#d8d5cd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.average{font-size:21px;font-weight:850;color:var(--gold)}.distribution{display:flex;height:6px;border-radius:99px;overflow:hidden;background:#222;margin:10px 0 7px}.distribution i{display:block}.r1{background:#de6259}.r2{background:#dc8550}.r3{background:#d9b54f}.r4{background:#8fbd68}.r5{background:#4ab47d}.cat-meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}
    table{border-collapse:collapse;width:100%}th{text-align:left;color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:9px;border-bottom:1px solid var(--line)}td{padding:11px 9px;border-bottom:1px solid #252525;vertical-align:top}.manager-name{font-weight:750}.stars{color:var(--gold);white-space:nowrap}.muted{color:var(--muted)}.positive{color:var(--green)}
    .reason{margin-bottom:12px}.reason-top{display:flex;justify-content:space-between;gap:10px;margin-bottom:5px}.reason-cat{color:var(--muted);font-size:11px}.bar{height:7px;background:#252525;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#9d6e34,var(--gold));border-radius:99px}
    .trend{display:flex;align-items:flex-end;gap:5px;height:115px;padding-top:12px}.trend-day{flex:1;min-width:5px;background:#3b301b;border-radius:4px 4px 0 0;position:relative}.trend-day:hover{background:var(--gold)}.trend-day span{display:none;position:absolute;bottom:calc(100% + 5px);left:50%;transform:translateX(-50%);background:#000;border:1px solid var(--line);padding:4px 6px;border-radius:6px;white-space:nowrap;z-index:2}.trend-day:hover span{display:block}
    .reviews-panel{margin-top:16px;overflow:hidden}.table-wrap{overflow:auto}.review-table{min-width:1050px}.attention{display:inline-flex;color:#ff9c94;background:#3b1e1c;border:1px solid #6b302c;border-radius:99px;padding:3px 7px;font-size:11px}.source{display:inline-flex;background:#252525;border-radius:99px;padding:3px 7px;color:#bbb}.comment-cell{max-width:310px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.detail-btn{border:1px solid #494138;background:#211d16;color:var(--gold);border-radius:8px;padding:6px 9px;cursor:pointer}
    .state{text-align:center;color:var(--muted);padding:45px}.error{color:#ff958d}.modal{position:fixed;inset:0;background:#000b;z-index:20;display:none;padding:20px;overflow:auto}.modal.open{display:flex}.modal-card{width:min(920px,100%);margin:auto;background:#111;border:1px solid #393939;border-radius:22px;padding:22px}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.modal-head h2{margin:0}.close{width:40px;height:40px;border:1px solid var(--line);background:#222;color:white;border-radius:50%;font-size:20px;cursor:pointer}.detail-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:17px}.detail-section{background:#181818;border:1px solid var(--line);border-radius:14px;padding:14px}.detail-section h3{margin:0 0 9px;color:var(--gold);font-size:14px}.kv{display:grid;grid-template-columns:145px 1fr;gap:6px 10px;margin:5px 0}.kv b{color:var(--muted);font-weight:500}.json{white-space:pre-wrap;word-break:break-word;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:#c8c4ba;background:#0b0b0b;padding:10px;border-radius:9px;max-height:300px;overflow:auto}
    @media(max-width:1050px){.filters{grid-template-columns:repeat(3,1fr)}.summary{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:650px){.layout{padding:14px}.header{align-items:flex-start;flex-direction:column}.header h1{font-size:27px}.filters{grid-template-columns:repeat(2,1fr)}.summary{grid-template-columns:repeat(2,1fr)}.category-grid,.detail-grid{grid-template-columns:1fr}.metric:last-child{grid-column:1/-1}.kv{grid-template-columns:110px 1fr}}
  </style>
</head>
<body>
  <main class="layout">
    <header class="header"><div><div class="brand">TEXNIKACH</div><h1>Отзывы клиентов</h1></div><p id="updated">Загрузка данных…</p></header>
    <section class="panel">
      <div class="periods" id="periods"><button class="period" data-period="today">Сегодня</button><button class="period" data-period="yesterday">Вчера</button><button class="period" data-period="7d">7 дней</button><button class="period active" data-period="30d">30 дней</button><button class="period" data-period="all">Всё время</button><button class="period" data-period="custom">Свой период</button></div>
      <div class="filters">
        <div class="field"><label>С даты</label><input id="dateFrom" type="date"></div><div class="field"><label>По дату</label><input id="dateTo" type="date"></div>
        <div class="field"><label>Менеджер</label><select id="manager"><option value="">Все</option></select></div>
        <div class="field"><label>Категория</label><select id="category"><option value="">Все</option></select></div>
        <div class="field"><label>Оценка</label><select id="rating"><option value="">Все</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></div>
        <div class="field"><label>Источник</label><select id="source"><option value="">Все</option></select></div>
      </div>
      <div class="checks"><label class="check"><input id="attention" type="checkbox"> Требуют внимания</label><label class="check"><input id="withComment" type="checkbox"> С комментарием</label><label class="check"><input id="withPhone" type="checkbox"> С телефоном</label><label class="check"><input id="includeTest" type="checkbox"> Показывать тестовые</label><button id="apply" class="apply">Применить</button></div>
    </section>
    <div id="content"><div class="state">Загрузка статистики…</div></div>
  </main>
  <div id="modal" class="modal"><article class="modal-card"><div class="modal-head"><h2 id="modalTitle">Отзыв</h2><button id="close" class="close">×</button></div><div id="detail"></div></article></div>
  <script id="admin-config" type="application/json">__ADMIN_CONFIG__</script>
  <script>
    const cfg=JSON.parse(document.getElementById('admin-config').textContent);let period='30d',optionsReady=false,lastData=null;
    const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const fmtDate=v=>v?new Intl.DateTimeFormat('ru-RU',{timeZone:'Asia/Tashkent',dateStyle:'short',timeStyle:'short'}).format(new Date(v)):'—';
    const stars=n=>n?`<span class="stars">${'★'.repeat(n)}${'☆'.repeat(5-n)}</span>`:'—';
    function query(){const p=new URLSearchParams({period});[['date_from','dateFrom'],['date_to','dateTo'],['manager','manager'],['category','category'],['rating','rating'],['source','source']].forEach(([key,id])=>{if($(id).value)p.set(key,$(id).value)});if($('attention').checked)p.set('attention','1');if($('withComment').checked)p.set('with_comment','1');if($('withPhone').checked)p.set('with_phone','1');if($('includeTest').checked)p.set('include_test','1');return p}
    async function load(){ $('content').innerHTML='<div class="state">Загрузка статистики…</div>';try{const url=new URL('/api/admin/reviews/stats',window.location.origin);url.search=query();const res=await fetch(url,{credentials:'same-origin',cache:'no-store'});if(!res.ok)throw new Error('HTTP '+res.status);const data=await res.json();lastData=data;setOptions(data.filter_options);render(data);$('updated').textContent='Обновлено '+new Date().toLocaleTimeString('ru-RU')}catch(e){$('content').innerHTML=`<div class="state error">Не удалось загрузить статистику: ${esc(e.message)}</div>`}}
    function setOptions(opts){if(optionsReady)return;opts.managers.forEach(m=>$('manager').insertAdjacentHTML('beforeend',`<option value="${esc(m.code)}">${esc(m.name)}</option>`));Object.entries(cfg.categories).forEach(([code,label])=>$('category').insertAdjacentHTML('beforeend',`<option value="${esc(code)}">${esc(label.replace('Как вы оцениваете ','').replace('?',''))}</option>`));opts.sources.forEach(s=>$('source').insertAdjacentHTML('beforeend',`<option value="${esc(s)}">${esc(s)}</option>`));optionsReady=true}
    function dist(c){const total=c.count||1;return [1,2,3,4,5].map(n=>`<i class="r${n}" style="width:${100*(c['r'+n]||0)/total}%"></i>`).join('')}
    function render(d){const s=d.summary,maxReason=Math.max(1,...d.reason_stats.map(x=>x.count)),maxTrend=Math.max(1,...d.trend.map(x=>x.count));$('content').innerHTML=`<section class="summary"><div class="metric"><div class="value">${s.total}</div><div class="label">Всего отзывов</div></div><div class="metric alert"><div class="value">${s.attention}</div><div class="label">Требуют внимания</div></div><div class="metric"><div class="value">${s.with_comment}</div><div class="label">С комментарием</div></div><div class="metric"><div class="value">${s.with_phone}</div><div class="label">С телефоном</div></div><div class="metric"><div class="value">${s.notified}</div><div class="label">Уведомлений отправлено</div></div></section>
      <div class="grid"><section class="panel"><div class="section-title"><h2>Оценки по категориям</h2><span>Средняя и распределение</span></div><div class="category-grid">${d.categories.map(c=>`<div class="category"><div class="cat-head"><div class="cat-name" title="${esc(c.label)}">${esc(c.label.replace('Как вы оцениваете ','').replace('?',''))}</div><div class="average">${c.average??'—'}</div></div><div class="distribution">${dist(c)}</div><div class="cat-meta"><span>${c.count} оценок</span><span>${c.r5||0} × 5★</span></div></div>`).join('')}</div></section>
      <section><div class="panel"><div class="section-title"><h2>Частые причины</h2><span>Топ-30</span></div>${d.reason_stats.length?d.reason_stats.map(r=>`<div class="reason"><div class="reason-top"><span>${esc(r.label)} <small class="reason-cat">${esc(r.category)}</small></span><b>${r.count}</b></div><div class="bar"><i style="width:${100*r.count/maxReason}%"></i></div></div>`).join(''):'<div class="muted">Причин пока нет</div>'}</div><div class="panel"><div class="section-title"><h2>Динамика</h2><span>Отзывы по дням</span></div><div class="trend">${d.trend.length?d.trend.map(t=>`<div class="trend-day" style="height:${Math.max(5,100*t.count/maxTrend)}%"><span>${esc(t.day)}: ${t.count}, ★ ${t.overall_average??'—'}</span></div>`).join(''):'<div class="muted">Нет данных</div>'}</div></div></section></div>
      <section class="panel"><div class="section-title"><h2>Статистика менеджеров</h2><span>Положительные — 4 и 5</span></div><div class="table-wrap"><table><thead><tr><th>Менеджер</th><th>Оценок</th><th>Средняя</th><th>1★</th><th>2★</th><th>3★</th><th>4★</th><th>5★</th><th>Положительных</th></tr></thead><tbody>${d.managers.map(m=>`<tr><td class="manager-name">${esc(m.name)}</td><td>${m.count}</td><td class="stars">${m.average??'—'}</td><td>${m.r1||0}</td><td>${m.r2||0}</td><td>${m.r3||0}</td><td>${m.r4||0}</td><td>${m.r5||0}</td><td class="positive">${m.positive_percent==null?'—':m.positive_percent+'%'}</td></tr>`).join('')}</tbody></table></div></section>
      <section class="panel reviews-panel"><div class="section-title"><h2>Последние отзывы</h2><span>До 100 записей</span></div><div class="table-wrap"><table class="review-table"><thead><tr><th>Дата</th><th>ID</th><th>Общая</th><th>Менеджер</th><th>Другие оценки</th><th>Телефон</th><th>Комментарий</th><th>Источник</th><th></th></tr></thead><tbody>${d.reviews.length?d.reviews.map(reviewRow).join(''):'<tr><td colspan="9" class="state">По выбранным фильтрам отзывов нет</td></tr>'}</tbody></table></div></section>`}
    function reviewRow(r){const managers=r.managers.map(m=>m.name||(m.type==='other'?'Другой':'Неизвестно')).join(', ')||'—';const comments=[r.final_comment,...Object.values(r.scores).map(x=>x.comment)].filter(Boolean).join(' · ');const other=Object.entries(r.scores).filter(([k])=>k!=='overall').map(([k,v])=>`${k}: ${v.rating}`).join(', ');return `<tr><td>${fmtDate(r.created_at)} ${r.needs_attention?'<br><span class="attention">Внимание</span>':''}</td><td>#${r.id}</td><td>${stars(r.scores.overall?.rating)}</td><td>${esc(managers)}</td><td>${esc(other||'—')}</td><td>${esc(r.customer_phone||'—')}</td><td class="comment-cell" title="${esc(comments)}">${esc(comments||'—')}</td><td><span class="source">${esc(r.source)}</span></td><td><button class="detail-btn" onclick="openDetail(${r.id})">Открыть</button></td></tr>`}
    async function openDetail(id){$('modal').classList.add('open');$('modalTitle').textContent='Отзыв #'+id;$('detail').innerHTML='<div class="state">Загрузка…</div>';try{const res=await fetch(new URL('/api/admin/reviews/'+id,window.location.origin),{credentials:'same-origin',cache:'no-store'});if(!res.ok)throw new Error('HTTP '+res.status);renderDetail(await res.json())}catch(e){$('detail').innerHTML=`<div class="state error">Ошибка: ${esc(e.message)}</div>`}}
    function renderDetail(r){const scoreHtml=Object.entries(r.scores).map(([k,v])=>`<div class="kv"><b>${esc(cfg.categories[k]||k)}</b><span>${stars(v.rating)}${v.comment?'<br>'+esc(v.comment):''}</span></div>`).join('')||'—';const reasons=Object.entries(r.reasons).flatMap(([cat,codes])=>codes.map(code=>`<li>${esc((cfg.reasons[cat]||{})[code]||code)}</li>`)).join('')||'<li>Нет</li>';const managers=r.managers.map(m=>m.name||(m.type==='other'?'Другой менеджер':'Не знаю / не помню')).join(', ')||'—';$('detail').innerHTML=`<div class="detail-grid"><section class="detail-section"><h3>Основное</h3><div class="kv"><b>Дата</b><span>${fmtDate(r.created_at)}</span></div><div class="kv"><b>Источник</b><span>${esc(r.source)}</span></div><div class="kv"><b>Язык</b><span>${esc(r.language)}</span></div><div class="kv"><b>Менеджеры</b><span>${esc(managers)}</span></div><div class="kv"><b>Телефон</b><span>${esc(r.customer_phone||'—')}</span></div><div class="kv"><b>Доставка</b><span>${r.is_delivery_used==null?'Не указано':r.is_delivery_used?'Да':'Нет'}</span></div><div class="kv"><b>Уведомление</b><span>${esc(r.notification_status)}</span></div></section><section class="detail-section"><h3>Оценки и комментарии</h3>${scoreHtml}<div class="kv"><b>Общий комментарий</b><span>${esc(r.final_comment||'—')}</span></div></section><section class="detail-section"><h3>Причины</h3><ul>${reasons}</ul></section><section class="detail-section"><h3>Запрос</h3><div class="kv"><b>User-Agent</b><span>${esc(r.user_agent||'—')}</span></div><div class="kv"><b>HTTP-язык</b><span>${esc(r.accept_language||'—')}</span></div><div class="kv"><b>Referer</b><span>${esc(r.referer||'—')}</span></div><div class="kv"><b>IP hash</b><span>${esc(r.ip_hash_short||'—')}</span></div></section><section class="detail-section" style="grid-column:1/-1"><h3>Данные устройства</h3><div class="json">${esc(JSON.stringify(r.device,null,2)||'{}')}</div></section><section class="detail-section" style="grid-column:1/-1"><h3>HTTP Client Hints</h3><div class="json">${esc(JSON.stringify(r.request_headers,null,2)||'{}')}</div></section></div>`}
    document.querySelectorAll('.period').forEach(b=>b.onclick=()=>{period=b.dataset.period;document.querySelectorAll('.period').forEach(x=>x.classList.toggle('active',x===b));if(period!=='custom')load()});$('apply').onclick=load;$('close').onclick=()=>$('modal').classList.remove('open');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('open')};document.addEventListener('keydown',e=>{if(e.key==='Escape')$('modal').classList.remove('open')});load();
  </script>
</body>
</html>
