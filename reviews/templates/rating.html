<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090909">
  <title>Texnikach — Оценка качества</title>
  <style>
    :root{--bg:#090909;--card:#141414;--line:#292929;--text:#f7f5ef;--muted:#aaa69d;--gold:#d6aa50;--gold2:#f3ce77;--bad:#f07c71;--radius:22px}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 50% -10%,#292112 0,#0d0d0d 32%,var(--bg) 65%);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
    button,input,textarea{font:inherit}.shell{width:min(720px,100%);margin:auto;padding:20px 16px calc(48px + env(safe-area-inset-bottom))}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:42px}.brand{font-weight:850;letter-spacing:.16em;font-size:18px}.brand span{color:var(--gold2)}.langs{display:flex;padding:3px;border:1px solid var(--line);border-radius:999px;background:#111}.lang{border:0;background:transparent;color:var(--muted);padding:7px 11px;border-radius:999px;cursor:pointer}.lang.active{background:var(--gold);color:#171006;font-weight:800}
    .hero{text-align:center;margin:0 auto 34px}.hero h1{font-size:clamp(30px,7vw,48px);line-height:1.08;margin:0 0 14px;letter-spacing:-.035em}.hero p{color:var(--muted);max-width:560px;margin:0 auto 9px}.optional{font-size:14px;color:#817e76}
    .card{background:linear-gradient(145deg,#171717,#111);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin:14px 0;box-shadow:0 15px 45px #0004}.question{font-size:19px;font-weight:750;margin:0 0 16px;letter-spacing:-.01em}.stars{display:flex;gap:7px;margin:2px -3px 8px}.star{width:50px;height:50px;border:0;background:transparent;color:#514a3d;font-size:38px;line-height:1;cursor:pointer;padding:0;transition:.16s transform,.16s color;touch-action:manipulation}.star:hover{transform:translateY(-2px)}.star.on{color:var(--gold2);filter:drop-shadow(0 2px 7px #d6aa5044)}.rating-label{min-height:22px;color:var(--gold2);font-size:14px;font-weight:700}
    .details{display:none;border-top:1px solid var(--line);margin-top:15px;padding-top:17px}.details.open{display:block;animation:reveal .2s ease-out}@keyframes reveal{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}.sub{font-size:14px;font-weight:750;margin:0 0 11px}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{min-height:44px;border:1px solid #3b3934;border-radius:999px;background:#1b1b1b;color:#d7d3ca;padding:9px 13px;cursor:pointer;text-align:left}.chip.selected{background:#332914;border-color:var(--gold);color:var(--gold2)}textarea,.phone{width:100%;border:1px solid #343434;background:#0d0d0d;color:var(--text);border-radius:14px;padding:13px 14px;outline:none;margin-top:14px}textarea{min-height:92px;resize:vertical}textarea:focus,.phone:focus{border-color:var(--gold)}
    .manager-block{margin:0 0 18px}.skip{display:inline-flex;align-items:center;gap:8px;border:1px solid #3b3934;background:#1b1b1b;color:#ddd7cc;border-radius:12px;min-height:44px;padding:9px 13px;margin:0 0 14px;cursor:pointer}.skip.active{border-color:var(--gold);color:var(--gold2);background:#332914}.card.disabled .stars{opacity:.28;pointer-events:none}.card.disabled .details{display:none}
    .complaint{border-color:#6a4933;background:linear-gradient(145deg,#211912,#15120f)}.complaint h2,.final h2{font-size:20px;margin:0 0 7px}.complaint p,.hint{color:var(--muted);font-size:14px;margin:0 0 14px}.actions{display:flex;gap:9px;flex-wrap:wrap}.link-btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:#171006;background:var(--gold2);font-weight:800;min-height:44px;padding:10px 16px;border-radius:12px}.link-btn.secondary{color:#eee;background:#252525;border:1px solid #3a3a3a}
    .submit{width:100%;min-height:58px;border:0;border-radius:16px;background:linear-gradient(135deg,var(--gold2),#b98732);color:#1c1407;font-weight:900;font-size:17px;margin-top:18px;cursor:pointer;box-shadow:0 12px 30px #d6aa5025}.submit:disabled{opacity:.55;cursor:wait}.privacy-note{color:#706d66;font-size:12px;text-align:center;margin:13px auto 0;max-width:560px}.error{display:none;color:#ff9a91;text-align:center;margin:13px 0}.error.show{display:block}.success{display:none;text-align:center;padding:60px 14px}.success.show{display:block}.success-mark{width:78px;height:78px;margin:0 auto 24px;border-radius:50%;display:grid;place-items:center;background:#2e2615;border:1px solid var(--gold);color:var(--gold2);font-size:38px}.success h1{font-size:34px;margin:0 0 10px}.success p{color:var(--muted);margin:0 0 24px}.hidden{display:none!important}.honeypot{position:absolute!important;left:-9999px!important;width:1px!important;height:1px!important;opacity:0!important}
    @media(max-width:390px){.shell{padding-left:12px;padding-right:12px}.card{padding:19px 16px}.star{width:46px;font-size:35px}.stars{gap:3px}}
  </style>
</head>
<body>
  <main class="shell">
    <div id="formView">
      <header class="top"><div class="brand">TEXNI<span>KACH</span></div><div class="langs"><button class="lang active" data-lang="ru">RU</button><button class="lang" data-lang="uz">UZ</button></div></header>
      <section class="hero"><h1 data-t="title"></h1><p data-t="subtitle"></p><div class="optional" data-t="optional"></div></section>
      <form id="reviewForm" novalidate>
        <input class="honeypot" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
        <div id="categories"></div>
        <section class="card final"><h2 data-t="anything"></h2><textarea id="finalComment" maxlength="2000" data-placeholder="finalPlaceholder"></textarea></section>
        <section class="card final"><h2 data-t="phoneTitle"></h2><input id="phone" class="phone" maxlength="50" inputmode="tel" placeholder="+998 __ ___ __ __"><p class="hint" data-t="phoneHint"></p></section>
        <section id="complaint" class="card complaint hidden"><h2 data-t="complaintTitle"></h2><p data-t="complaintText"></p><div class="actions"><a id="callLink" class="link-btn hidden" data-t="call"></a><a id="complaintTelegram" class="link-btn secondary hidden" target="_blank" rel="noopener" data-t="writeTelegram"></a></div></section>
        <div id="error" class="error" role="alert"></div><button id="submit" class="submit" type="submit" data-t="submit"></button><p class="privacy-note" data-t="privacy"></p>
      </form>
    </div>
    <section id="success" class="success"><div class="success-mark">✓</div><h1 data-t="thanks"></h1><p data-t="thanksText"></p><div class="actions" style="justify-content:center"><a id="siteLink" class="link-btn" data-t="returnSite"></a><a id="socialLink" class="link-btn secondary hidden" target="_blank" rel="noopener">Instagram</a></div></section>
  </main>
  <script id="reviews-config" type="application/json">__REVIEWS_CONFIG__</script>
  <script>
    const cfg=JSON.parse(document.getElementById('reviews-config').textContent);let lang='ru';
    const text={ru:{title:'Помогите нам стать лучше',subtitle:'Расскажите о вашем опыте. Это поможет нам улучшить сервис.',optional:'Вы можете отвечать только на те вопросы, которые хотите.',managers:'С каким менеджером вы общались?',otherManager:'Другой менеджер',unknownManager:'Не знаю / не помню',improve:'Что можно было сделать лучше?',comment:'Комментарий (необязательно)',noDelivery:'Не пользовался доставкой',anything:'Хотите что-нибудь добавить?',finalPlaceholder:'Ваш комментарий, предложение или замечание',phoneTitle:'Номер телефона, с которого вы с нами общались',phoneHint:'Необязательно. Номер поможет нам найти ваш звонок или заказ и разобраться в ситуации.',complaintTitle:'Есть жалоба или проблема?',complaintText:'Если вам нужно, чтобы мы лично разобрались в ситуации, свяжитесь с нами напрямую.',call:'Позвонить',writeTelegram:'Написать в Telegram',submit:'Отправить оценку',sending:'Отправляем…',empty:'Пожалуйста, поставьте хотя бы одну оценку или оставьте комментарий либо номер телефона.',genericError:'Не удалось отправить. Попробуйте ещё раз.',rateLimit:'Слишком много отправок. Пожалуйста, попробуйте немного позже.',thanks:'Спасибо за вашу оценку!',thanksText:'Ваше мнение помогает Texnikach становиться лучше.',returnSite:'Вернуться на Texnikach.uz',privacy:'Для защиты от спама сохраняются обезличенный хеш IP и технические данные браузера.'},uz:{title:'Yaxshiroq bo‘lishimizga yordam bering',subtitle:'Tajribangiz haqida aytib bering. Bu xizmatimizni yaxshilashga yordam beradi.',optional:'Faqat xohlagan savollaringizga javob berishingiz mumkin.',managers:'Qaysi menejer bilan gaplashdingiz?',otherManager:'Boshqa menejer',unknownManager:'Bilmayman / eslay olmayman',improve:'Nimani yaxshiroq qilishimiz mumkin edi?',comment:'Izoh (ixtiyoriy)',noDelivery:'Yetkazib berishdan foydalanmadim',anything:'Yana biror narsa qo‘shmoqchimisiz?',finalPlaceholder:'Izohingiz, taklifingiz yoki fikringiz',phoneTitle:'Biz bilan bog‘langan telefon raqamingiz',phoneHint:'Ixtiyoriy. Raqam qo‘ng‘iroq yoki buyurtmangizni topib, vaziyatni o‘rganishga yordam beradi.',complaintTitle:'Shikoyat yoki muammo bormi?',complaintText:'Vaziyatni shaxsan ko‘rib chiqishimiz kerak bo‘lsa, biz bilan bevosita bog‘laning.',call:'Qo‘ng‘iroq qilish',writeTelegram:'Telegram’da yozish',submit:'Bahoni yuborish',sending:'Yuborilmoqda…',empty:'Kamida bitta baho, izoh yoki telefon raqamini kiriting.',genericError:'Yuborib bo‘lmadi. Qayta urinib ko‘ring.',rateLimit:'Juda ko‘p yuborish urinishi. Birozdan keyin qayta urinib ko‘ring.',thanks:'Bahoyingiz uchun rahmat!',thanksText:'Fikringiz Texnikach xizmatini yaxshilashga yordam beradi.',returnSite:'Texnikach.uz saytiga qaytish',privacy:'Spamdan himoya qilish uchun anonim IP xeshi va brauzerning texnik ma’lumotlari saqlanadi.'}};
    const ratingLabels={ru:['','Очень плохо','Плохо','Нормально','Хорошо','Отлично'],uz:['','Juda yomon','Yomon','Qoniqarli','Yaxshi','A’lo']};const state={scores:{},reasons:{},managers:[],is_delivery_used:null};
    const esc=s=>String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    function categoryCard(code){const manager=code==='manager'?`<div class="manager-block"><p class="sub" data-t="managers"></p><div class="chips">${cfg.managers.map(m=>`<button type="button" class="chip manager-chip" data-manager="${esc(m.code)}">${esc(m.name)}</button>`).join('')}<button type="button" class="chip manager-chip" data-manager="other" data-t="otherManager"></button><button type="button" class="chip manager-chip" data-manager="unknown" data-t="unknownManager"></button></div></div>`:'';const skip=['delivery','courier'].includes(code)?`<button type="button" class="skip" data-skip="${code}" data-t="noDelivery"></button>`:'';return `<section class="card" data-category="${code}">${manager}<h2 class="question">${esc(cfg.categories[code][lang])}</h2>${skip}<div class="stars" role="radiogroup">${[1,2,3,4,5].map(n=>`<button type="button" class="star" data-rating="${n}" aria-label="${n}">★</button>`).join('')}</div><div class="rating-label"></div><div class="details"><p class="sub" data-t="improve"></p><div class="chips">${Object.entries(cfg.reasons[code]).map(([key,label])=>`<button type="button" class="chip reason-chip" data-reason="${key}">${esc(label[lang])}</button>`).join('')}</div><textarea maxlength="2000" data-comment="${code}" data-placeholder="comment"></textarea></div></section>`}
    function render(){document.documentElement.lang=lang;document.getElementById('categories').innerHTML=Object.keys(cfg.categories).map(categoryCard).join('');document.querySelectorAll('[data-t]').forEach(el=>el.textContent=text[lang][el.dataset.t]);document.querySelectorAll('[data-placeholder]').forEach(el=>el.placeholder=text[lang][el.dataset.placeholder]);document.querySelectorAll('.lang').forEach(el=>el.classList.toggle('active',el.dataset.lang===lang));bind();restoreState()}
    function bind(){document.querySelectorAll('.star').forEach(btn=>btn.onclick=()=>{const card=btn.closest('.card'),code=card.dataset.category,n=Number(btn.dataset.rating);state.scores[code]={rating:n,comment:state.scores[code]?.comment||''};if(code==='delivery'||code==='courier')state.is_delivery_used=true;if(n===5){delete state.reasons[code];card.querySelectorAll('.reason-chip').forEach(chip=>chip.classList.remove('selected'))}updateCard(card,code)});document.querySelectorAll('.reason-chip').forEach(btn=>btn.onclick=()=>{const code=btn.closest('.card').dataset.category;state.reasons[code]=state.reasons[code]||[];const i=state.reasons[code].indexOf(btn.dataset.reason);i<0?state.reasons[code].push(btn.dataset.reason):state.reasons[code].splice(i,1);btn.classList.toggle('selected')});document.querySelectorAll('.manager-chip').forEach(btn=>btn.onclick=()=>{const code=btn.dataset.manager,i=state.managers.indexOf(code);i<0?state.managers.push(code):state.managers.splice(i,1);btn.classList.toggle('selected')});document.querySelectorAll('[data-skip]').forEach(btn=>btn.onclick=()=>{state.is_delivery_used=state.is_delivery_used===false?null:false;document.querySelectorAll('[data-category="delivery"],[data-category="courier"]').forEach(card=>{card.classList.toggle('disabled',state.is_delivery_used===false);card.querySelector('.skip')?.classList.toggle('active',state.is_delivery_used===false)});if(state.is_delivery_used===false){delete state.scores.delivery;delete state.scores.courier;delete state.reasons.delivery;delete state.reasons.courier}});document.querySelectorAll('[data-comment]').forEach(area=>area.oninput=()=>{const code=area.dataset.comment;if(state.scores[code])state.scores[code].comment=area.value})}
    function updateCard(card,code){const n=state.scores[code]?.rating||0;card.querySelectorAll('.star').forEach(s=>s.classList.toggle('on',Number(s.dataset.rating)<=n));card.querySelector('.rating-label').textContent=ratingLabels[lang][n]||'';card.querySelector('.details').classList.toggle('open',n>0&&n<5)}
    function restoreState(){document.querySelectorAll('[data-category]').forEach(card=>{const code=card.dataset.category;updateCard(card,code);(state.reasons[code]||[]).forEach(r=>card.querySelector(`[data-reason="${r}"]`)?.classList.add('selected'));if(state.scores[code])card.querySelector('[data-comment]').value=state.scores[code].comment||''});state.managers.forEach(m=>document.querySelector(`[data-manager="${m}"]`)?.classList.add('selected'));if(state.is_delivery_used===false)document.querySelectorAll('[data-category="delivery"],[data-category="courier"]').forEach(card=>{card.classList.add('disabled');card.querySelector('.skip')?.classList.add('active')})}
    document.querySelectorAll('.lang').forEach(btn=>btn.onclick=()=>{lang=btn.dataset.lang;render()});const complaint=document.getElementById('complaint');if(cfg.complaintPhone||cfg.complaintTelegram)complaint.classList.remove('hidden');if(cfg.complaintPhone){const a=document.getElementById('callLink');a.href='tel:'+cfg.complaintPhone.replace(/\s/g,'');a.classList.remove('hidden')}if(cfg.complaintTelegram){const a=document.getElementById('complaintTelegram');a.href=cfg.complaintTelegram;a.classList.remove('hidden')}document.getElementById('siteLink').href=cfg.siteUrl;if(cfg.instagramUrl){const a=document.getElementById('socialLink');a.href=cfg.instagramUrl;a.classList.remove('hidden')}
    async function collectDeviceData(){try{const nav=window.navigator||{},connection=nav.connection||nav.mozConnection||nav.webkitConnection||null,data={language:nav.language||null,languages:Array.from(nav.languages||[]),timezone:Intl.DateTimeFormat().resolvedOptions().timeZone||null,timezone_offset_minutes:new Date().getTimezoneOffset(),screen_width:window.screen.width,screen_height:window.screen.height,screen_avail_width:window.screen.availWidth,screen_avail_height:window.screen.availHeight,color_depth:window.screen.colorDepth,pixel_depth:window.screen.pixelDepth,viewport_width:window.innerWidth,viewport_height:window.innerHeight,device_pixel_ratio:window.devicePixelRatio||1,max_touch_points:Number(nav.maxTouchPoints||0),touch_supported:'ontouchstart'in window||Number(nav.maxTouchPoints||0)>0,platform:nav.platform||null,hardware_concurrency:nav.hardwareConcurrency||null,device_memory_gb:nav.deviceMemory||null,cookie_enabled:Boolean(nav.cookieEnabled),do_not_track:nav.doNotTrack||null,online:Boolean(nav.onLine),color_scheme:window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light',reduced_motion:window.matchMedia('(prefers-reduced-motion: reduce)').matches,connection:connection?{effective_type:connection.effectiveType||null,downlink_mbps:connection.downlink||null,rtt_ms:connection.rtt||null,save_data:Boolean(connection.saveData)}:null,user_agent_data:nav.userAgentData?{brands:nav.userAgentData.brands||[],mobile:Boolean(nav.userAgentData.mobile),platform:nav.userAgentData.platform||null}:null,high_entropy:null};if(nav.userAgentData?.getHighEntropyValues){try{data.high_entropy=await nav.userAgentData.getHighEntropyValues(['architecture','bitness','formFactors','fullVersionList','model','platformVersion'])}catch(_){}}return data}catch(_){return {}}}
    document.getElementById('reviewForm').onsubmit=async e=>{e.preventDefault();document.querySelectorAll('[data-comment]').forEach(area=>{if(state.scores[area.dataset.comment])state.scores[area.dataset.comment].comment=area.value});const payload={language:lang,source:cfg.source,scores:state.scores,reasons:state.reasons,managers:state.managers,is_delivery_used:state.is_delivery_used,final_comment:document.getElementById('finalComment').value,customer_phone:document.getElementById('phone').value,website:e.target.website.value};const has=Object.keys(payload.scores).length||Object.keys(payload.reasons).length||payload.final_comment.trim()||payload.customer_phone.trim();const err=document.getElementById('error');if(!has){err.textContent=text[lang].empty;err.classList.add('show');return}err.classList.remove('show');const submit=document.getElementById('submit');submit.disabled=true;submit.textContent=text[lang].sending;payload.device=await collectDeviceData();try{const res=await fetch('/api/reviews',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':cfg.csrfToken},body:JSON.stringify(payload)});if(!res.ok){const data=await res.json().catch(()=>({}));throw new Error(data.detail==='rate_limit'?'rateLimit':'genericError')}document.getElementById('formView').classList.add('hidden');document.getElementById('success').classList.add('show');window.scrollTo({top:0,behavior:'smooth'})}catch(ex){err.textContent=text[lang][ex.message]||text[lang].genericError;err.classList.add('show');submit.disabled=false;submit.textContent=text[lang].submit}};render();
  </script>
</body>
</html>
