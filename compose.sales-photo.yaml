services:
  sales-photo-bot:
    build:
      context: .
      dockerfile: Dockerfile.sales-photo
    restart: unless-stopped
    stop_grace_period: 180s
    init: true
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 256
    environment:
      SALES_PHOTO_BOT_TOKEN: ${SALES_PHOTO_BOT_TOKEN:?set SALES_PHOTO_BOT_TOKEN}
      SALES_PHOTO_CHAT_ID: ${SALES_PHOTO_CHAT_ID:?set SALES_PHOTO_CHAT_ID}
      SALES_PHOTO_CHECK_CHAT_ID: ${SALES_PHOTO_CHECK_CHAT_ID:?set SALES_PHOTO_CHECK_CHAT_ID}
      SALES_PHOTO_DB_PATH: /app/data/sales_photo.db
      SALES_PHOTO_DELIVERY_DB_PATH: /app/delivery-data/delivery.db
      SALES_PHOTO_DELIVERY_SYNC_SECONDS: "${SALES_PHOTO_DELIVERY_SYNC_SECONDS:-15}"
      SALES_PHOTO_CALLS_DB_PATH: /app/calls-data/calls.db
      SALES_PHOTO_CALLS_SYNC_SECONDS: "${SALES_PHOTO_CALLS_SYNC_SECONDS:-30}"
      SALES_PHOTO_HEARTBEAT_PATH: /tmp/sales-photo-heartbeat
      SALES_PHOTO_ALLOWED_USER_IDS: "${SALES_PHOTO_ALLOWED_USER_IDS:-}"
      SALES_PHOTO_DELETE_RETRY_SECONDS: "${SALES_PHOTO_DELETE_RETRY_SECONDS:-30}"
      SALES_PHOTO_SOURCE_EDIT_GRACE_SECONDS: "${SALES_PHOTO_SOURCE_EDIT_GRACE_SECONDS:-3}"
      SALES_PHOTO_STARTUP_DRAIN_SECONDS: "${SALES_PHOTO_STARTUP_DRAIN_SECONDS:-10}"
      SALES_PHOTO_CONCURRENT_UPDATES: "${SALES_PHOTO_CONCURRENT_UPDATES:-4}"
      SALES_PHOTO_DROP_PENDING_ON_FIRST_START: "${SALES_PHOTO_DROP_PENDING_ON_FIRST_START:-true}"
      SALES_PHOTO_LOG_LEVEL: "${SALES_PHOTO_LOG_LEVEL:-INFO}"
    volumes:
      - sales-photo-data:/app/data
      # Normal reads use SQLite mode=ro. A narrow integration bridge updates
      # only sales-card request/result fields. Both images use UID/GID 10001.
      - texnikach-delivery-data:/app/delivery-data
      # SQLite is opened with mode=ro. The mount is writable only so a live WAL
      # database can use its existing shared-memory sidecars.
      - botmoizvonki-data:/app/calls-data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  sales-photo-data:
  texnikach-delivery-data:
    external: true
  botmoizvonki-data:
    external: true
    name: ${SALES_PHOTO_CALLS_VOLUME:-nylgfmvjodgie9dga7ngprgl-botmoizvonki-data}
