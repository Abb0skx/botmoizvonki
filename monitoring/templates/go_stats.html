<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <title>Texnikach GO — Statistics</title>
  <link rel="stylesheet" href="/monitoring/assets/go-stats.css">
</head>
<body>
  <main class="page">
    <div class="container">
      <header class="header">
        <a class="logo" href="/monitoring" aria-label="Вернуться в общий мониторинг">
          <span class="logo-mark">T</span><span>TEXNIKACH</span>
        </a>
        <div class="header-actions">
          <a class="header-button" href="/monitoring">Все разделы</a>
          <button class="header-button" id="refresh" type="button">Обновить</button>
        </div>
      </header>

      <h1>GO Statistics</h1>
      <p class="subtitle">Просмотры и действия пользователей на texnikach.uz/go</p>

      <nav class="periods" aria-label="Период статистики">
        <button class="period-button active" data-period="today" type="button">Сегодня</button>
        <button class="period-button" data-period="7d" type="button">7 дней</button>
        <button class="period-button" data-period="30d" type="button">30 дней</button>
        <button class="period-button" data-period="all" type="button">Всё время</button>
      </nav>

      <div class="state" id="state" role="status">Загружаем статистику…</div>
      <section id="content" hidden>
        <div class="hero-grid">
          <article class="metric metric-main"><span>ПРОСМОТРЫ</span><strong id="views">0</strong></article>
          <article class="metric"><span>ОСНОВНЫЕ КЛИКИ</span><strong id="mainClicks">0</strong></article>
          <article class="metric"><span>КАРТЫ</span><strong id="mapClicks">0</strong></article>
        </div>

        <section class="section">
          <h2>ОСНОВНЫЕ ДЕЙСТВИЯ</h2>
          <div class="stats-card" id="mainActions"></div>
        </section>
        <section class="section">
          <h2>КАРТЫ И НАВИГАЦИЯ</h2>
          <div class="stats-card" id="mapActions"></div>
        </section>
        <section class="section">
          <h2>ЗАКАЗ</h2>
          <div class="stats-card" id="orderActions"></div>
        </section>

        <section class="history">
          <h2>ПОСЛЕДНИЕ 30 ДНЕЙ</h2>
          <div class="history-scroll">
            <table>
              <thead><tr><th>Дата</th><th>Просмотры</th><th>Основные клики</th><th>Карты</th><th>Заказы</th></tr></thead>
              <tbody id="historyRows"></tbody>
            </table>
          </div>
        </section>
      </section>
      <footer>TEXNIKACH · GO ANALYTICS</footer>
    </div>
  </main>
  <script src="/monitoring/assets/go-stats.js" defer></script>
</body>
</html>
