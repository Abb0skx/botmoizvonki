<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0c1014">
  <title>TEXNIKACH — вход в мониторинг</title>
  <link rel="stylesheet" href="/monitoring/assets/monitoring.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="brand-mark">T</div>
    <div class="eyebrow">TEXNIKACH · ВНУТРЕННИЙ ПОРТАЛ</div>
    <h1>Рабочие показатели<br>в одном месте</h1>
    <p class="auth-copy">__STATE__. Введите общий пароль.</p>
    <form class="password-login" method="post" action="/monitoring/login">
      <input type="hidden" name="next" value="__NEXT__">
      <label for="password">Пароль</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <p class="auth-error" role="alert">__ERROR__</p>
      <button type="submit">Войти</button>
    </form>
    <p class="auth-note">После входа это устройство будет запомнено.</p>
  </main>
</body>
</html>
